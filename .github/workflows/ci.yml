name: Validaciones

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Revisar vulnerabilidades de dependencias
        run: npm audit --audit-level=moderate
      - name: Compilar API y Angular
        run: npm run build
      - name: Probar reglas y permisos
        run: npm test
